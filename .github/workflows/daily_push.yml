name: Daily ETF Signal Push

# 为什么不是一个时间点一个 cron：
# 一是 GitHub 的 schedule 本身不可靠（best-effort，负载高时延迟、足够高时直接丢弃）；
# 二是盘中价格每秒在变，取到推送发出有几分钟延迟，落在一个窗口里比卡死一个时刻稳。
# 所以不管哪个来源触发，都是「目标时段的整个小时里多次触发 + 分钟数错开整点」，
# 由 daily_etf_push.py 按北京时间窗口判定是否真正推送。
#
# Server酱免费版的约束（每天 5 条、每分钟 50 条）决定了这里的两个设计：
#   1) 先占坑（写 cache）再推送：同一时段只会有一次发送机会，最坏情况就是这一时段没发出，
#      绝不会因为去重失效或额度超限而反复重试把 5 条额度烧光。
#   2) 手动触发默认 preview，只跑分析不发微信，调试不占额度；确要认真发再把 mode 选成 push。

on:
  schedule:
    # 保留但不依赖：GitHub 的 schedule 实测对本仓库根本不注册触发（yml 逐字正确、public、
    # main 为默认分支，提交后仍零触发，社区有多个同类 Bug 报告），所以定时改走下面的
    # workflow_dispatch 由外部定时器驱动。哪天 GitHub 修好了，这三条会自动恢复干活，
    # 和外部触发撞在同一时段也不会发重（先占坑 + cache 去重只让第一跳真发）。
    # 分钟取 8/18/28/38/48/58 而不是 0/10/20：官方文档明确「整点开始」是 Actions
    # 高负载时段，schedule 会被延迟、负载足够高时排队任务会被直接丢弃。
    # 北京时间 08:00-09:59（UTC 00:00-01:59）→ 盘前窗口 08:50-09:20 命中 08:58 / 09:08 / 09:18
    - cron: '8-58/10 0-1 * * 1-5'
    # 北京时间 11:00-11:59（UTC 03:00-03:59）→ 盘中窗口 11:00-11:30 命中 11:08 / 11:18 / 11:28
    - cron: '8-58/10 3 * * 1-5'
    # 北京时间 15:00-15:59（UTC 07:00-07:59）→ 盘后窗口 15:20-15:50 命中 15:28 / 15:38 / 15:48
    - cron: '8-58/10 7 * * 1-5'
  # 主力定时入口：外部定时器（cron-job.org）每天在三个时段内每 5 分钟用 REST 调一次
  # workflow_dispatch，传 source=schedule + mode=push，由脚本按北京时间窗口判定并占坑。
  # 为什么借 workflow_dispatch 而不是更名正言顺的 repository_dispatch：后者要求
  # fine-grained token 带 Contents: write 权限，那个权限能直接改仓库代码，token 泄露的
  # 代价太大；Actions: write 只能触发和查看 run，改不了任何东西。
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview = 只跑分析不发微信（不占额度）；push = 真发一条（占用每日 5 条额度）'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - push
      source:
        # 外部定时器必须传 schedule；网页手动 Run workflow 时留空即可
        description: 'schedule = 按北京时间窗口判定并占坑（外部定时器用）；留空 = 手动调试，不占坑'
        required: false
        default: ''
        type: string

concurrency:
  group: etf-push
  cancel-in-progress: false

jobs:
  push-signal:
    # 固定镜像版本：GitHub 正在把 ubuntu-latest 迁移到 Ubuntu 26，固定 24.04 可以避开迁移期的不确定因素
    # （以后想跟新系统，改回 ubuntu-latest 即可）
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 判定推送时段（北京时间）
        id: slot
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE: ${{ github.event.inputs.source }}
        run: |
          # 网页手动 Run workflow（没填 source）→ manual：不占坑，配合默认 preview 随便调试
          # 外部定时器（source=schedule）→ 走窗口判定，命中才发且占坑
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$SOURCE" != "schedule" ]; then
            date_bj=$(TZ=Asia/Shanghai date +%F)
            slot=manual
          else
            out=$(python3 daily_etf_push.py --detect-slot)
            date_bj=$(echo "$out" | sed -n 's/^date=//p')
            slot=$(echo "$out" | sed -n 's/^slot=//p')
          fi
          echo "date=$date_bj" >> "$GITHUB_OUTPUT"
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "检测结果：date=$date_bj slot=${slot:-（不在推送窗口内）}"

      - name: 检查该时段是否已处理
        id: dedup
        if: steps.slot.outputs.slot != '' && steps.slot.outputs.slot != 'manual'
        uses: actions/cache/restore@v6
        with:
          path: .push_state
          key: etf-push-${{ steps.slot.outputs.date }}-${{ steps.slot.outputs.slot }}
          # 只需要知道「坑有没有被占」，不需要把标记文件下载下来
          lookup-only: true

      - name: 不在推送窗口内，跳过
        if: steps.slot.outputs.slot == ''
        run: echo "当前时间不在推送窗口内，跳过"

      - name: 本时段已处理过，跳过
        if: steps.dedup.outputs.cache-hit == 'true'
        run: echo "本时段已处理过（含延迟补跑），跳过，不再消耗额度"

      - name: Set up Python
        if: steps.slot.outputs.slot != '' && steps.dedup.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.slot.outputs.slot != '' && steps.dedup.outputs.cache-hit != 'true'
        run: pip install -q akshare pandas numpy requests

      # 占坑放在推送之前：宁可「这个时段没发出」也不「重复发把额度烧光」
      - name: 占坑（标记本时段已处理）
        if: success() && steps.slot.outputs.slot != '' && steps.slot.outputs.slot != 'manual' && steps.dedup.outputs.cache-hit != 'true'
        run: |
          mkdir -p .push_state
          date -u +%FT%TZ > .push_state/pushed_at

      - name: 保存去重标记
        # 极端情况下（延迟导致两个 job 同时跑）同一 key 可能已被写入，save 失败不影响推送结果
        continue-on-error: true
        if: success() && steps.slot.outputs.slot != '' && steps.slot.outputs.slot != 'manual' && steps.dedup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .push_state
          key: etf-push-${{ steps.slot.outputs.date }}-${{ steps.slot.outputs.slot }}

      - name: Run analysis and push
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SLOT: ${{ steps.slot.outputs.slot }}
          MODE: ${{ github.event.inputs.mode }}
        if: steps.slot.outputs.slot != '' && steps.dedup.outputs.cache-hit != 'true'
        run: |
          ARGS="--slot $SLOT"
          # 手动触发且没显式选 push → 只预览，不动用每天 5 条的额度
          if [ "$SLOT" = "manual" ] && [ "$MODE" != "push" ]; then
            ARGS="$ARGS --preview"
            echo "预览模式：只打印消息，不调用 Server酱"
          fi
          python daily_etf_push.py $ARGS
